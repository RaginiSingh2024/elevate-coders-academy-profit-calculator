*{box-sizing:border-box}body{margin:0;background:#fff7fb;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{padding:25px max(20px,calc((100% - 1180px)/2));background:linear-gradient(110deg,#fff,#fce7f3);border-bottom:1px solid var(--line)}h1{margin:0;color:var(--navy);font-size:30px}header p{margin:5px 0;color:var(--muted)}main{max-width:1180px;margin:22px auto;padding:0 16px 40px}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 8px 25px #70204b0b}.panel h2{margin:0 0 13px;color:var(--navy);font-size:19px}label{display:block;font-weight:650;font-size:13px;margin:12px 0 5px}input,select{width:100%;padding:10px;border:1px solid #d8c8d2;border-radius:9px;background:white;font:inherit;color:var(--ink)}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hint,.muted,.foot{font-size:12px;color:var(--muted)}.btn{border:0;border-radius:10px;background:var(--pink);color:white;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}.btn.alt{background:#f3e8ef;color:var(--ink)}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.kpi span{display:block;color:var(--muted);font-size:12px}.kpi strong{display:block;font-size:20px;overflow-wrap:anywhere}.good{color:var(--green)}.bad{color:var(--red)}.pill{display:inline-block;background:var(--pale);color:#9d174d;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}.note{margin:13px 0;padding:12px;background:#fff8e6;border:1px solid #f2d38c;border-radius:10px;font-size:13px}.headrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.chartbox{margin-top:15px;border:1px solid var(--line);border-radius:12px;padding:12px}canvas{width:100%;height:230px;disp <header><h1>Elevate Coders Academy</h1><p>Course Fee & Batch Profit Calculator <span class="pill">Live calculations</span></p></header>
<main><div class="layout">
<section class="panel inputs"><h2>Enter batch parameters</h2>
<label>Course</label><select id="course"><option>C Programming</option><option>C++ Programming</option><option>Python Programming</option><option>Core Java & Advanced Java</option><option>Full Stack Development with Java</option><option>Full Stack Development with Python</option><option>MERN Stack Development</option><option>MERN Stack with DevOps + AWS</option><option>Mobile App Development with Flutter</option><option>Linux Programming</option><option>Data + DevOps with AWS</option><option>Custom course</option></select>
<div class="two"><div><label>Mode</label><select id="mode"><option>Offline</option><option>Online</option><option>Offline + DSA Combo</option><option>Custom</option></select></div><div><label>Fee per student (₹)</label><input id="fee" type="number" min="0" value="4000"></div></div>
<div class="two"><div><label>Paid students</label><input id="students" type="number" min="0" value="10"></div><div><label>Duration (months)</label><input id="duration" type="number" min="0" value="1"></div></div>
<label>Trainer cost per batch (₹)</label><input id="trainer" type="number" min="0" value="50000">
<label>Operations allocation (%)</label><input id="ops" type="number" min="0" max="100" value="50">
<label>Enrolment source</label><select id="source"><option value="direct">Direct — Academy keeps 100% of balance</option><option value="collab">Collaboration / coaching referral</option></select>
<div id="collabfields"><label>Referral commission (%)</label><input id="commission" type="number" min="0" max="100" value="10"><div class="hint">Illustrative rate; confirm with Sir.</div>
<label>Commission treatment</label><select id="treatment"><option value="inside">Included within operations allocation</option><option value="outside">Additional cost on top of operations</option></select>
<label>Collaboration profit split (%)</label><div class="two"><div><label>Suraj Sir</label><input id="suraj" type="number" value="60"></div><div><label>Ragini</label><input id="ragini" type="number" value="20"></div></div><label>Sweta (%)</label><input id="sweta" type="number" value="20"><div class="hint">Shares should total 100%. Direct enrolments ignore this split.</div></div>
<div class="actions"><button class="btn" id="reset">Reset example</button><button class="btn alt" id="print">Print / Save PDF</button></div>
</section>
<section class="panel"><div class="headrow"><h2>Live batch summary</h2><span class="pill" id="badge">Direct enrolment</span></div>
<div class="kpis"><div class="kpi"><span>Gross revenue</span><strong id="gross"></strong></div><div class="kpi"><span>Operations allocation</span><strong id="opsout"></strong></div><div class="kpi"><span>Trainer cost</span><strong id="trainerout"></strong></div><div class="kpi"><span>Referral commission</span><strong id="commout"></strong></div><div class="kpi"><span>Net balance / loss</span><strong id="balance"></strong></div><div class="kpi"><span>Break-even students (approx.)</span><strong id="be"></strong></div></div>
<div class="note" id="explanation"></div><h3>Balance allocation</h3><p id="allocation" class="muted"></p>
<div class="chartbox"><h3>Revenue and modelled costs</h3><canvas id="bars" width="900" height="260"></canvas></div><div class="chartbox"><h3>Profit / loss by number of students (0–30)</h3><canvas id="line" width="900" height="260"></canvas></div></section></div>
<section class="panel" style="margin-top:16px"><div class="headrow"><h2>Student-count scenario table</h2><button class="btn alt noprint" id="csv">Export CSV</button></div><p class="muted">Updates automatically. Trainer cost is treated as a fixed batch cost. The row list includes 1, 2, 3, 4, 5, 8, 10, 15 and 20 students.</p><div class="tablewrap"><table id="table"><thead></thead><tbody></tbody></table></div><p class="foot">Planning tool only. Operations allocation is a budget assumption, not verified actual cost. Excludes taxes, refunds, discounts, payment fees and other costs not entered. Trainer compensation must be agreed and commercially viable for each course/batch.</p></section></main>
<script>
const $=id=>document.getElementById(id), defaults={
"C Programming":{"Offline":4000,"Offline + DSA Combo":14000},
"C++ Programming":{"Offline":8000,"Offline + DSA Combo":18000},
"Python Programming":{"Offline":10000,"Offline + DSA Combo":20000},
"Core Java & Advanced Java":{"Offline":20000,"Offline + DSA Combo":30000},
"Full Stack Development with Java":{"Online":20000,"Offline":40000},
"Full Stack Development with Python":{"Online":20000,"Offline":40000},
"MERN Stack Development":{"Online":20000,"Offline":40000},
"MERN Stack with DevOps + AWS":{"Online":30000,"Offline":50000},
"Mobile App Development with Flutter":{"Online":20000,"Offline":40000},
"Linux Programming":{"Offline":4000},
"Data + DevOps with AWS":{"Offline":40000}};
const counts=[1,2,3,4,5,8,10,15,20];let rows=[];
const money=n=>(n<0?"−":"")+ "₹"+Math.round(Math.abs(n)).toLocaleString("en-IN");
const val=id=>Math.max(0,Number($(id).value)||0);
function feePreset(){let c=$("course").value,m=$("mode").value;if(defaults[c]&&defaults[c][m]!==undefined)$("fee").value=defaults[c][m]}
function params(){return {fee:val("fee"),students:Math.floor(val("students")),trainer:val("trainer"),ops:Math.min(100,val("ops"))/100,source:$("source").value,commission:Math.min(100,val("commission"))/100,treatment:$("treatment").value,shares:[val("suraj"),val("ragini"),val("sweta")]}}
function calc(n,p){let gross=p.fee*n,ops=gross*p.ops,comm=p.source==="collab"&&p.treatment==="outside"?gross*p.commission:0,balance=gross-ops-p.trainer-comm;return {n,gross,ops,trainer:p.trainer,comm,balance,commInside:p.source==="collab"&&p.treatment==="inside"?gross*p.commission:0}}
function share(r,p){if(r.balance<=0)return "No profit distribution; loss to cover";if(p.source==="direct")return "Academy retains 100%: "+money(r.balance);let sum=p.shares.reduce((a,b)=>a+b,0);if(sum<=0)return "Enter valid shares";return `Suraj ${money(r.balance*p.shares[0]/sum)} · Ragini ${money(r.balance*p.shares[1]/sum)} · Sweta ${money(r.balance*p.shares[2]/sum)}`}
function renderTable(p){let direct=p.source==="direct",heads=direct?["Students","Gross revenue","50% / ops","Trainer cost","Balance","Academy retention / status"]:["Students","Gross revenue","Operations","Trainer cost","Commission on top","Balance","Profit distribution / status"]; $("table").querySelector("thead").innerHTML="<tr>"+heads.map(x=>"<th>"+x+"</th>").join("")+"</tr>";rows=counts.map(n=>calc(n,p));$("table").querySelector("tbody").innerHTML=rows.map(r=>{let c=direct?[r.n,money(r.gross),money(r.ops),money(r.trainer),money(r.balance),share(r,p)]:[r.n,money(r.gross),money(r.ops),money(r.trainer),money(r.comm),money(r.balance),share(r,p)];return "<tr>"+c.map(x=>"<td>"+x+"</td>").join("")+"</tr>"}).join("")}
function barChart(p,r){let c=$("bars").getContext("2d"),w=c.canvas.width,h=c.canvas.height;c.clearRect(0,0,w,h);let items=[["Gross",r.gross],["Ops",r.ops],["Trainer",r.trainer],["Commission",p.source==="collab"?(p.treatment==="outside"?r.comm:r.commInside):0],["Balance",r.balance]],max=Math.max(1,...items.map(i=>Math.abs(i[1]))),base=h-40,plot=h-65,slot=(w-80)/items.length;c.font="17px Arial";items.forEach((it,i)=>{let bh=Math.abs(it[1])/max*plot,x=55+i*slot+slot*.22;c.fillStyle=it[1]<0?"#c24152":["#d91d72","#6b8bb3","#e7a12b","#8b5cf6","#07865e"][i];c.fillRect(x,base-bh,slot*.55,bh);c.fillStyle="#6b5662";c.textAlign="center";c.fillText(it[0],x+slot*.27,h-12);c.fillText(Math.round(it[1]).toLocaleString("en-IN"),x+slot*.27,Math.max(15,base-bh-6))})}
function lineChart(p){let c=$("line").getContext("2d"),w=c.canvas.width,h=c.canvas.height;c.clearRect(0,0,w,h);let vals=Array.from({length:31},(_,n)=>calc(n,p).balance),min=Math.min(0,...vals),max=Math.max(1,...vals),x=n=>50+n/30*(w-70),y=v=>15+(max-v)/(max-min)*(h-55);c.strokeStyle="#eadbe4";c.fillStyle="#7d6875";c.font="14px Arial";for(let i=0;i<=4;i++){let v=min+(max-min)*i/4,yy=y(v);c.beginPath();c.moveTo(50,yy);c.lineTo(w-20,yy);c.stroke();c.fillText(Math.round(v).toLocaleString("en-IN"),2,yy+4)}c.strokeStyle="#d91d72";c.lineWidth=4;c.beginPath();vals.forEach((v,n)=>n?c.lineTo(x(n),y(v)):c.moveTo(x(n),y(v)));c.stroke();[0,5,10,15,20,25,30].forEach(n=>c.fillText(n,x(n)-3,h-10))}
function update(){let p=params(),r=calc(p.students,p),comm=p.source==="collab"?(p.treatment==="outside"?r.comm:r.commInside):0; $("gross").textContent=money(r.gross);$("opsout").textContent=money(r.ops);$("trainerout").textContent=money(r.trainer);$("commout").textContent=money(comm);$("balance").textContent=money(r.balance);$("balance").className=r.balance>=0?"good":"bad";let contribution=p.fee*(1-p.ops-(p.source==="collab"&&p.treatment==="outside"?p.commission:0));$("be").textContent=contribution>0?Math.ceil(p.trainer/contribution):"N/A";$("badge").textContent=p.source==="direct"?"Direct — 100% Academy":"Collaboration — divided";$("collabfields").style.display=p.source==="collab"?"block":"none";let splitIssue=p.source==="collab"&&p.shares.reduce((a,b)=>a+b,0)!==100;let message=r.balance<0?`Loss of ${money(Math.abs(r.balance))}. At ${money(p.fee)} per student and ${p.students} paid students, the course has ${money(r.gross)} gross revenue. A ${money(p.trainer)} trainer fee plus the operations allocation is not covered. Set an affordable trainer arrangement or achieve the displayed break-even student count.`:p.source==="direct"?`Direct enrolment: after operations ${money(r.ops)} and trainer cost ${money(r.trainer)}, the Academy retains ${money(r.balance)}.`:`Collaboration enrolment: balance after modelled costs is ${money(r.balance)}. Apply the configured profit split only if positive.`;$("explanation").textContent=message+(splitIssue?" Shares currently total "+p.shares.reduce((a,b)=>a+b,0)+"%; adjust them to 100%.":"");$("allocation").textContent=share(r,p);barChart(p,r);lineChart(p);renderTable(p)}
$("course").addEventListener("change",()=>{feePreset();update()});$("mode").addEventListener("change",()=>{feePreset();update()});["fee","students","trainer","ops","source","commission","treatment","suraj","ragini","sweta"].forEach(id=>$(id).addEventListener("input",update));
$("reset").onclick=()=>{ $("course").value="C Programming";$("mode").value="Offline";$("fee").value=4000;$("students").value=10;$("duration").value=1;$("trainer").value=50000;$("ops").value=50;$("source").value="direct";$("commission").value=10;$("treatment").value="inside";$("suraj").value=60;$("ragini").value=20;$("sweta").value=20;update()};
$("print").onclick=()=>window.print();$("csv").onclick=()=>{let p=params(),direct=p.source==="direct",heads=direct?["Students","Gross","Operations","Trainer","Balance","Status"]:["Students","Gross","Operations","Trainer","Commission on top","Balance","Distribution"];let data=[heads,...rows.map(r=>direct?[r.n,r.gross,r.ops,r.trainer,r.balance,share(r,p)]:[r.n,r.gross,r.ops,r.trainer,r.comm,r.balance,share(r,p)])];let csv=data.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="elevate-course-calculations.csv";a.click();URL.revokeObjectURL(a.href)};update();
</script></body></html> -->
